<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- Apply saved theme before React mounts to prevent flash of wrong theme -->
    <script>
      (function() {
        function resolveAutoByCrmTime() {
          var tz = 'Africa/Cairo';
          try {
            var prefs = JSON.parse(localStorage.getItem('systemPrefs') || '{}');
            if (prefs.crmTimeZone) tz = prefs.crmTimeZone;
          } catch (e) {}
          try {
            var hour = Number(new Intl.DateTimeFormat('en-US', {
              timeZone: tz,
              hour: 'numeric',
              hour12: false,
            }).format(new Date()));
            return (hour >= 18 || hour < 6) ? 'dark' : 'light';
          } catch (e) {
            return 'light';
          }
        }

        try {
          var theme = localStorage.getItem('theme');
          if (!theme) {
            try { theme = JSON.parse(localStorage.getItem('systemPrefs') || '{}').theme } catch {}
          }
          var resolved = theme === 'dark' ? 'dark'
            : theme === 'light' ? 'light'
            : theme === 'auto'
              ? resolveAutoByCrmTime()
              : 'light'; // default to light if nothing saved
          document.documentElement.classList.add(resolved);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self'; 
      img-src 'self' data: blob: http: https: https://images.unsplash.com https://source.unsplash.com https://dummyimage.com https://*.tile.openstreetmap.org https://mt0.google.com https://mt1.google.com https://mt2.google.com https://mt3.google.com https://unpkg.com https://www.facebook.com https://www.google-analytics.com https://www.googletagmanager.com; 
      media-src 'self' data: blob: http: https:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; 
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://connect.facebook.net https://www.googletagmanager.com https://www.google-analytics.com https://static.cloudflareinsights.com; 
      worker-src 'self' blob:; 
      child-src 'self' blob: https://maps.google.com https://www.google.com; 
      frame-src 'self' blob: https://maps.google.com https://www.google.com https://www.googletagmanager.com;
      connect-src 'self' http: https: ws: wss: https://restcountries.com https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org https://www.google-analytics.com https://stats.g.doubleclick.net https://www.facebook.com https://cloudflareinsights.com; 
      font-src 'self' data: https://fonts.gstatic.com;">
    
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="Permissions-Policy" content="geolocation=(self), microphone=(), camera=(), unload=(self)">
    
    <title>Be Souhola</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Handle OAuth callback redirects for HashRouter
      (function() {
        if (window.location.pathname === '/auth/google/callback') {
          window.location.replace('/#' + window.location.pathname + window.location.search);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>
    <script>
      try {
        var lang = localStorage.getItem('language') || 'en';
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </body>
</html>
