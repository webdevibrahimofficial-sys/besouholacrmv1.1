server {
    listen 80;
    server_name yourdomain.com;

    root /var/www/public;
    index index.php index.html;
    client_max_body_size 64m;

    # Use Docker's embedded DNS resolver with a short TTL so nginx re-resolves
    # service hostnames (app, reverb) on every request instead of caching the
    # IP forever. Without this, rebuilding/recreating the "app" container
    # (new IP each time) leaves nginx stuck pointing at the old, dead IP until
    # nginx itself is restarted — causing "502 Bad Gateway / Connection refused".
    resolver 127.0.0.11 valid=10s;

    location /app {
        set $reverb_upstream reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://$reverb_upstream:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app;
        include fastcgi_params;
        fastcgi_pass $php_upstream:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }

    location ~ /\.ht {
        deny all;
    }
}
