services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./:/var/www
    ports:
      - "8081:8080"
    depends_on:
      - app
      - redis
    networks:
      - laravel

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=0"]
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - db
      - redis
    networks:
      - laravel

  web:
    image: nginx:latest
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: yourpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8082:80"
    depends_on:
      - db
    networks:
      - laravel

  frontend:
    image: node:20-alpine
    container_name: crm_frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web
    networks:
      - laravel

  wa_mirror_service:
    build:
      context: ../wa-mirror-service
      dockerfile: Dockerfile
    container_name: wa_mirror_service
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../wa-mirror-service/.env
    environment:
      PORT: "3000"
      WA_AUTH_PATH: "/app/src/auth-state"
      LARAVEL_INTERNAL_URL: "http://laravel_web/api/internal/whatsapp-mirror/webhook"
    ports:
      - "3001:3000"
    volumes:
      - wa_mirror_sessions:/app/src/auth-state
    networks:
      - laravel

volumes:
  db_data:
  frontend_node_modules:
  wa_mirror_sessions:

networks:
  laravel:
